<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>压扁小鸡 - Flatten the Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;display:flex;justify-content:center;align-items:center;font-family:monospace}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
//  Flatten the Bird - Pixel Art Game
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 640;
canvas.width = W; canvas.height = H;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
addEventListener('resize', resize);

const PIPE_X = 110;
const PIPE_W = 52;
const GROUND_Y = H - 64;

let state = 'start';
let score = 0;
let highScore = parseInt(localStorage.getItem('ftb_hi') || '0');
let pipeGapY = H / 2 - 60;
let pipeGapSize = 125;
let targetGapY = pipeGapY;
let chickens = [];
let clouds = [];
let particles = [];
let feathers = [];
let spawnTimer = 0;
let frame = 0;
let shakeTimer = 0;
let shakeX = 0, shakeY = 0;
let comboCount = 0;
let comboTimer = 0;
let scorePopups = [];
let pointerDown = false;
let pointerY = H / 2;
let overFrame = 0;

function getCanvasY(e) {
  const rect = canvas.getBoundingClientRect();
  return ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) * (H / rect.height);
}
function getCanvasX(e) {
  const rect = canvas.getBoundingClientRect();
  return ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * (W / rect.width);
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  pointerDown = true;
  pointerY = getCanvasY(e);
  handleTap(getCanvasX(e), pointerY);
});
canvas.addEventListener('mousemove', e => {
  if (pointerDown || state === 'play') pointerY = getCanvasY(e);
});
canvas.addEventListener('mouseup', () => { pointerDown = false; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  pointerDown = true;
  pointerY = getCanvasY(e);
  handleTap(getCanvasX(e), pointerY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  pointerY = getCanvasY(e);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  pointerDown = false;
}, { passive: false });

function handleTap(x, y) {
  if (state === 'start') { startGame(); }
  else if (state === 'over' && frame - overFrame > 30) { state = 'start'; }
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * W, y: 30 + Math.random() * 140,
      w: 40 + Math.random() * 60, speed: 0.15 + Math.random() * 0.3,
      opacity: 0.5 + Math.random() * 0.4
    });
  }
}

function spawnChicken() {
  const minY = 60, maxY = GROUND_Y - 30;
  const difficulty = Math.min(score / 20, 1);
  const baseSpeed = 1.2 + difficulty * 2.0;
  const speed = baseSpeed + Math.random() * (0.8 + difficulty * 1.2);
  let vy = 0;
  if (Math.random() > 0.7 && score > 5) vy = (Math.random() - 0.5) * (1 + difficulty);
  chickens.push({
    x: W + 30, y: minY + Math.random() * (maxY - minY),
    speed, w: 28, h: 22, alive: true, passed: false,
    crushed: false, crushTimer: 0,
    wingFrame: Math.random() * 100 | 0, vy, flash: 0
  });
}

function spawnCrushParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 6, vy: -2 - Math.random() * 4,
      life: 30 + Math.random() * 20, maxLife: 50,
      color: ['#FFD700','#FFA500','#FF6347','#FF4500','#FFFF00'][Math.random()*5|0],
      size: 2 + Math.random() * 3
    });
  }
  for (let i = 0; i < 6; i++) {
    feathers.push({
      x, y, vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 3,
      life: 50 + Math.random() * 30, maxLife: 80,
      rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.2,
      color: Math.random() > 0.5 ? '#FFF8DC' : '#FFEFD5', size: 3 + Math.random() * 3
    });
  }
}

function startGame() {
  state = 'play'; score = 0;
  chickens = []; particles = []; feathers = []; scorePopups = [];
  spawnTimer = 0; pipeGapY = H / 2 - 60; targetGapY = pipeGapY;
  pipeGapSize = 125; comboCount = 0; comboTimer = 0; frame = 0;
  initClouds();
}

function getSpawnInterval() { return Math.max(28, 100 - score * 3); }
function getGapSize() { return Math.max(62, 130 - score * 2.5); }

function update() {
  frame++;
  if (state === 'start') { updateClouds(); return; }
  if (state === 'over') { if (shakeTimer > 0) { shakeTimer--; shakeX = (Math.random()-0.5)*6; shakeY = (Math.random()-0.5)*6; } else { shakeX=0; shakeY=0; } return; }
  updateClouds();
  pipeGapSize = getGapSize();
  targetGapY = pointerY - pipeGapSize / 2;
  targetGapY = Math.max(10, Math.min(GROUND_Y - pipeGapSize - 10, targetGapY));
  pipeGapY += (targetGapY - pipeGapY) * 0.12;
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnChicken();
    spawnTimer = getSpawnInterval();
    if (score > 10 && Math.random() < 0.3) setTimeout(() => { if (state === 'play') spawnChicken(); }, 300);
    if (score > 25 && Math.random() < 0.2) setTimeout(() => { if (state === 'play') spawnChicken(); }, 600);
  }
  for (let c of chickens) {
    if (c.crushed) { c.crushTimer++; c.y += 2; if (c.crushTimer > 60) c.alive = false; continue; }
    c.x -= c.speed; c.wingFrame++; c.y += c.vy;
    if (c.y < 40) { c.y = 40; c.vy = Math.abs(c.vy); }
    if (c.y > GROUND_Y - 15) { c.y = GROUND_Y - 15; c.vy = -Math.abs(c.vy); }
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
    if (!c.passed && cx < PIPE_X + PIPE_W && cx > PIPE_X) {
      const gapTop = pipeGapY, gapBot = pipeGapY + pipeGapSize;
      if (cy > gapTop + 8 && cy < gapBot - 8) {
        c.passed = true; gameOver(); return;
      } else {
        c.crushed = true; c.crushTimer = 0; score++;
        comboCount++; comboTimer = 60;
        const bonusText = comboCount > 1 ? `+1 x${comboCount}` : '+1';
        scorePopups.push({ x: c.x, y: c.y - 10, text: bonusText, vy: -2, life: 40, maxLife: 40 });
        spawnCrushParticles(c.x + c.w / 2, c.y + c.h / 2);
        shakeTimer = 8;
        if (score > highScore) { highScore = score; localStorage.setItem('ftb_hi', highScore); }
      }
    }
    if (c.x < -40) c.alive = false;
  }
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) comboCount = 0; }
  chickens = chickens.filter(c => c.alive);
  for (let p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (let f of feathers) { f.x += f.vx; f.y += f.vy; f.vy += 0.03; f.vx *= 0.99; f.rot += f.rotSpeed; f.life--; }
  feathers = feathers.filter(f => f.life > 0);
  for (let s of scorePopups) { s.y += s.vy; s.life--; }
  scorePopups = scorePopups.filter(s => s.life > 0);
  if (shakeTimer > 0) { shakeTimer--; shakeX = (Math.random()-0.5)*6; shakeY = (Math.random()-0.5)*6; }
  else { shakeX = 0; shakeY = 0; }
}

function updateClouds() {
  for (let c of clouds) {
    c.x -= c.speed;
    if (c.x + c.w < 0) { c.x = W + 20; c.y = 30 + Math.random() * 140; }
  }
}

function gameOver() { state = 'over'; overFrame = frame; shakeTimer = 15; }

// ─── Drawing ───
function draw() {
  ctx.save(); ctx.translate(shakeX, shakeY);
  drawSky(); drawClouds(); drawMountains(); drawTrees(); drawGround();
  if (state === 'play' || state === 'over') {
    drawPipe(); drawChickens(); drawParticles(); drawScorePopups(); drawScore();
    if (comboCount > 1 && comboTimer > 0) drawCombo();
  }
  ctx.restore();
  if (state === 'start') drawStartScreen();
  if (state === 'over') drawGameOverScreen();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4A90D9'); g.addColorStop(0.4, '#87CEEB');
  g.addColorStop(0.7, '#B0E0FF'); g.addColorStop(1, '#C8F0FF');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#FFF7AA'; ctx.beginPath(); ctx.arc(W - 60, 60, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFEC80'; ctx.beginPath(); ctx.arc(W - 60, 60, 22, 0, Math.PI * 2); ctx.fill();
}

function drawClouds() {
  for (let c of clouds) {
    ctx.fillStyle = `rgba(255,255,255,${c.opacity})`;
    const cx = c.x, cy = c.y, w = c.w, h = w * 0.45;
    ctx.fillRect(cx + w * 0.1, cy, w * 0.8, h);
    ctx.fillRect(cx, cy + h * 0.3, w, h * 0.5);
    ctx.fillRect(cx + w * 0.2, cy - h * 0.2, w * 0.35, h * 0.5);
    ctx.fillRect(cx + w * 0.5, cy - h * 0.15, w * 0.3, h * 0.45);
  }
}

function drawMountains() {
  ctx.fillStyle = '#7AB87A';
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y - 60);
  ctx.lineTo(60, GROUND_Y - 120); ctx.lineTo(130, GROUND_Y - 70);
  ctx.lineTo(200, GROUND_Y - 140); ctx.lineTo(280, GROUND_Y - 80);
  ctx.lineTo(340, GROUND_Y - 130); ctx.lineTo(400, GROUND_Y - 90);
  ctx.lineTo(400, GROUND_Y - 40); ctx.lineTo(0, GROUND_Y - 40);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6AA86A';
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y - 40);
  ctx.lineTo(80, GROUND_Y - 90); ctx.lineTo(160, GROUND_Y - 50);
  ctx.lineTo(240, GROUND_Y - 100); ctx.lineTo(320, GROUND_Y - 55);
  ctx.lineTo(400, GROUND_Y - 85); ctx.lineTo(400, GROUND_Y - 40);
  ctx.lineTo(0, GROUND_Y - 40); ctx.closePath(); ctx.fill();
}

function drawTrees() {
  const positions = [20, 70, 180, 260, 310, 360];
  for (let tx of positions) {
    const ty = GROUND_Y - 40;
    ctx.fillStyle = '#8B6914'; ctx.fillRect(tx - 3, ty - 20, 6, 22);
    ctx.fillStyle = '#2E8B2E'; ctx.fillRect(tx - 14, ty - 36, 28, 18);
    ctx.fillStyle = '#3AA63A'; ctx.fillRect(tx - 11, ty - 46, 22, 14);
    ctx.fillStyle = '#45B845'; ctx.fillRect(tx - 8, ty - 54, 16, 12);
  }
}

function drawGround() {
  ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, GROUND_Y - 8, W, 12);
  ctx.fillStyle = '#8B6C42'; ctx.fillRect(0, GROUND_Y + 4, W, H - GROUND_Y);
  ctx.fillStyle = '#6B4C32'; ctx.fillRect(0, GROUND_Y + 20, W, H - GROUND_Y - 16);
  ctx.fillStyle = '#66BB6A';
  for (let i = 0; i < W; i += 12) {
    const h = 4 + Math.sin(i * 0.5) * 3;
    ctx.fillRect(i, GROUND_Y - 8 - h, 3, h);
    ctx.fillRect(i + 5, GROUND_Y - 8 - h + 2, 2, h - 2);
  }
  ctx.fillStyle = '#FF69B4';
  for (let i = 15; i < W; i += 45) {
    ctx.fillRect(i, GROUND_Y - 14, 4, 4);
    ctx.fillStyle = '#FFD700'; ctx.fillRect(i + 1, GROUND_Y - 13, 2, 2);
    ctx.fillStyle = '#FF69B4';
  }
}

function drawPipeSegment(x, y, w, h, isTop) {
  if (h <= 0) return;
  ctx.fillStyle = '#2E8B2E'; ctx.fillRect(x + 4, y, w - 8, h);
  ctx.fillStyle = '#3CB043'; ctx.fillRect(x + 4, y, 8, h);
  ctx.fillStyle = '#1E6B1E'; ctx.fillRect(x + w - 12, y, 8, h);
  ctx.fillStyle = '#165016'; ctx.fillRect(x + w - 4, y, 4, h);
  ctx.fillStyle = '#236B23'; ctx.fillRect(x, y, 4, h);
  const capH = 16, capExt = 8;
  const capY = isTop ? y + h - capH : y;
  ctx.fillStyle = '#2E8B2E'; ctx.fillRect(x - capExt, capY, w + capExt * 2, capH);
  ctx.fillStyle = '#3CB043'; ctx.fillRect(x - capExt, capY, 10, capH);
  ctx.fillStyle = '#1E6B1E'; ctx.fillRect(x + w + capExt - 10, capY, 10, capH);
  ctx.fillStyle = '#165016';
  ctx.fillRect(x - capExt, capY, w + capExt * 2, 3);
  ctx.fillRect(x - capExt, capY + capH - 3, w + capExt * 2, 3);
  ctx.fillStyle = '#45C745'; ctx.fillRect(x - capExt + 3, capY + 4, w + capExt * 2 - 16, 3);
}

function drawPipe() {
  const gapTop = pipeGapY, gapBot = pipeGapY + pipeGapSize;
  drawPipeSegment(PIPE_X, 0, PIPE_W, gapTop, true);
  drawPipeSegment(PIPE_X, gapBot, PIPE_W, GROUND_Y - gapBot, false);
}

function drawChicken(c) {
  const x = c.x | 0, y = c.y | 0;
  if (c.crushed) { drawFlatChicken(x, y + c.crushTimer * 0.5, c.crushTimer); return; }
  const wingUp = Math.sin(c.wingFrame * 0.25) > 0;
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(x + 2, y + 20, 24, 4);
  ctx.fillStyle = '#FFD700'; ctx.fillRect(x + 4, y + 4, 18, 14);
  ctx.fillStyle = '#FFF0B0'; ctx.fillRect(x + 6, y + 10, 12, 6);
  ctx.fillStyle = '#FFD700'; ctx.fillRect(x + 18, y, 10, 12);
  ctx.fillStyle = '#000'; ctx.fillRect(x + 24, y + 3, 3, 3);
  ctx.fillStyle = '#FFF'; ctx.fillRect(x + 25, y + 3, 1, 1);
  ctx.fillStyle = '#FF8C00'; ctx.fillRect(x + 28, y + 6, 4, 3);
  ctx.fillStyle = '#E07000'; ctx.fillRect(x + 28, y + 8, 4, 2);
  ctx.fillStyle = '#FF4444';
  ctx.fillRect(x + 20, y - 4, 3, 5); ctx.fillRect(x + 23, y - 6, 3, 7); ctx.fillRect(x + 26, y - 3, 3, 4);
  ctx.fillRect(x + 24, y + 10, 3, 4);
  ctx.fillStyle = '#E8C200';
  if (wingUp) { ctx.fillRect(x + 6, y - 2, 10, 6); ctx.fillRect(x + 8, y - 5, 6, 4); }
  else { ctx.fillRect(x + 6, y + 6, 10, 6); ctx.fillRect(x + 8, y + 10, 6, 4); }
  ctx.fillStyle = '#E8B800';
  ctx.fillRect(x - 2, y + 2, 6, 4); ctx.fillRect(x - 4, y, 5, 3); ctx.fillRect(x - 3, y + 5, 5, 3);
  ctx.fillStyle = '#FF8C00'; ctx.fillRect(x + 8, y + 18, 2, 5); ctx.fillRect(x + 16, y + 18, 2, 5);
  ctx.fillStyle = '#E07000'; ctx.fillRect(x + 6, y + 22, 5, 2); ctx.fillRect(x + 14, y + 22, 5, 2);
}

function drawFlatChicken(x, y, timer) {
  const alpha = Math.max(0, 1 - timer / 60);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFD700'; ctx.fillRect(x, y + 8, 28, 6);
  ctx.fillStyle = '#FFD700'; ctx.fillRect(x + 22, y + 4, 8, 6);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 25, y + 5, 2, 2); ctx.fillRect(x + 27, y + 7, 2, 2);
  ctx.fillRect(x + 27, y + 5, 2, 2); ctx.fillRect(x + 25, y + 7, 2, 2);
  ctx.fillStyle = '#FF8C00'; ctx.fillRect(x + 30, y + 7, 3, 2);
  ctx.fillStyle = '#FF4444'; ctx.fillRect(x + 23, y + 2, 6, 3);
  ctx.fillStyle = '#FF8C00'; ctx.fillRect(x + 6, y + 14, 2, 3); ctx.fillRect(x + 18, y + 14, 2, 3);
  ctx.globalAlpha = 1;
}

function drawChickens() { for (let c of chickens) drawChicken(c); }

function drawParticles() {
  for (let p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x | 0, p.y | 0, p.size, p.size);
  }
  for (let f of feathers) {
    ctx.globalAlpha = (f.life / f.maxLife) * 0.8;
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.fillStyle = f.color;
    ctx.fillRect(-f.size, -1, f.size * 2, 2);
    ctx.fillRect(-f.size + 1, -2, f.size, 1);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawScorePopups() {
  for (let s of scorePopups) {
    ctx.globalAlpha = s.life / s.maxLife;
    ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.strokeText(s.text, s.x, s.y); ctx.fillText(s.text, s.x, s.y);
  }
  ctx.globalAlpha = 1;
}

function drawScore() {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.moveTo(W/2-40+6,8); ctx.lineTo(W/2+40-6,8);
  ctx.quadraticCurveTo(W/2+40,8,W/2+40,14); ctx.lineTo(W/2+40,34);
  ctx.quadraticCurveTo(W/2+40,40,W/2+34,40); ctx.lineTo(W/2-34,40);
  ctx.quadraticCurveTo(W/2-40,40,W/2-40,34); ctx.lineTo(W/2-40,14);
  ctx.quadraticCurveTo(W/2-40,8,W/2-34,8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.strokeText(score, W / 2, 24); ctx.fillText(score, W / 2, 24);
}

function drawCombo() {
  ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#FF4444'; ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2;
  const text = `COMBO x${comboCount}!`;
  ctx.strokeText(text, W / 2, 52); ctx.fillText(text, W / 2, 52);
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.moveTo(W/2-150+16,100); ctx.lineTo(W/2+150-16,100);
  ctx.quadraticCurveTo(W/2+150,100,W/2+150,116); ctx.lineTo(W/2+150,264);
  ctx.quadraticCurveTo(W/2+150,280,W/2+134,280); ctx.lineTo(W/2-134,280);
  ctx.quadraticCurveTo(W/2-150,280,W/2-150,264); ctx.lineTo(W/2-150,116);
  ctx.quadraticCurveTo(W/2-150,100,W/2-134,100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 4;
  ctx.strokeText('\u538b\u6241\u5c0f\u9e21', W / 2, 145);
  ctx.fillText('\u538b\u6241\u5c0f\u9e21', W / 2, 145);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 14px monospace';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.strokeText('FLATTEN THE BIRD', W / 2, 180);
  ctx.fillText('FLATTEN THE BIRD', W / 2, 180);
  ctx.font = '13px monospace'; ctx.fillStyle = '#FFE4B5';
  ctx.strokeStyle = 'transparent'; ctx.lineWidth = 0;
  ctx.fillText('\u79fb\u52a8\u9f20\u6807/\u624b\u6307 \u63a7\u5236\u6c34\u7ba1\u4e0a\u4e0b', W / 2, 220);
  ctx.fillText('\u6321\u4f4f\u5c0f\u9e21\u4e0d\u8ba9\u901a\u8fc7\uff01', W / 2, 242);
  ctx.fillText('\u5c0f\u9e21\u7a7f\u8fc7\u6c34\u7ba1\u5219\u6e38\u620f\u7ed3\u675f', W / 2, 264);
  const bobY = Math.sin(frame * 0.06) * 8;
  drawChicken({ x: W / 2 - 14, y: 320 + bobY, w: 28, h: 22, wingFrame: frame, crushed: false, crushTimer: 0, alive: true });
  if (Math.sin(frame * 0.08) > 0) {
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 18px monospace';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText('\u70b9\u51fb\u5f00\u59cb\u6e38\u620f', W / 2, 410);
    ctx.fillText('\u70b9\u51fb\u5f00\u59cb\u6e38\u620f', W / 2, 410);
  }
  if (highScore > 0) {
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px monospace';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText('\u6700\u9ad8\u5206: ' + highScore, W / 2, 460);
    ctx.fillText('\u6700\u9ad8\u5206: ' + highScore, W / 2, 460);
  }
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(30,30,60,0.85)';
  ctx.beginPath();
  ctx.moveTo(W/2-130+16,160); ctx.lineTo(W/2+130-16,160);
  ctx.quadraticCurveTo(W/2+130,160,W/2+130,176); ctx.lineTo(W/2+130,384);
  ctx.quadraticCurveTo(W/2+130,400,W/2+114,400); ctx.lineTo(W/2-114,400);
  ctx.quadraticCurveTo(W/2-130,400,W/2-130,384); ctx.lineTo(W/2-130,176);
  ctx.quadraticCurveTo(W/2-130,160,W/2-114,160); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#FF6347'; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#FF6347'; ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.strokeText('\u6e38\u620f\u7ed3\u675f', W / 2, 205);
  ctx.fillText('\u6e38\u620f\u7ed3\u675f', W / 2, 205);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 16px monospace'; ctx.lineWidth = 0;
  ctx.fillText('\u5f97\u5206', W / 2, 252);
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 48px monospace';
  ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
  ctx.strokeText(score, W / 2, 295); ctx.fillText(score, W / 2, 295);
  ctx.fillStyle = '#AAA'; ctx.font = '14px monospace';
  ctx.strokeStyle = 'transparent'; ctx.lineWidth = 0;
  ctx.fillText('\u6700\u9ad8\u5206: ' + highScore, W / 2, 340);
  if (score >= highScore && score > 0) {
    ctx.globalAlpha = 0.8 + Math.sin(frame * 0.1) * 0.2;
    ctx.fillStyle = '#FF4444'; ctx.font = 'bold 16px monospace';
    ctx.fillText('\ud83c\udfc6 \u65b0\u7eaa\u5f55!', W / 2, 362);
    ctx.globalAlpha = 1;
  }
  if (frame - overFrame > 30 && Math.sin(frame * 0.08) > 0) {
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 16px monospace';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText('\u70b9\u51fb\u91cd\u65b0\u5f00\u59cb', W / 2, 388);
    ctx.fillText('\u70b9\u51fb\u91cd\u65b0\u5f00\u59cb', W / 2, 388);
  }
}

let lastTime = 0;
function loop(time) {
  if (lastTime === 0) lastTime = time;
  if (time - lastTime >= 16) { lastTime = time; update(); draw(); }
  requestAnimationFrame(loop);
}
initClouds();
requestAnimationFrame(loop);
</script>
